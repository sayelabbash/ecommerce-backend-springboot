spring.application.name=E-Commerce

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8081

jwt.secret=${JWT_SECRET}

razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Comma-separated list of allowed frontend origins, e.g. http://localhost:5500,https://myshop.com
# Use * (default) to allow any origin during development.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Default admin account created automatically on first startup if it doesn't exist yet.
admin.email=${ADMIN_EMAIL:admin@shopsphere.com}
admin.password=${ADMIN_PASSWORD:Admin@123}

# Max file upload size, used if you wire up server-side image uploads later.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
